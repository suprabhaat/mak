
name: Release Mak

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Package repository
        run: |
          zip -r "mak-${GITHUB_REF_NAME}.zip" . \
            -x ".git/*" \
               ".github/*"

      - name: Generate SHA-256 checksum
        run: |
          sha256sum "mak-${GITHUB_REF_NAME}.zip" \
            > "mak-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: Mak ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            mak-${{ github.ref_name }}.zip
            mak-${{ github.ref_name }}.zip.sha256
